name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-type-check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve builds
        run: pnpm approve-builds @nestjs/core @prisma/client @prisma/engines prisma

      - name: Generate Prisma Client
        run: pnpm --filter @insan/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Build
        run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: lint-type-check-build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: docker build --target api-production -t insan-api:latest .

      - name: Build Web image
        run: docker build --target web-production -t insan-web:latest .
