worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=web:10m rate=30r/s;

    upstream api {
        server api:4000;
    }

    upstream web {
        server web:5000;
    }

    # Plain HTTP, default/catch-all. Kept serving content directly (not
    # redirected) so every IP-based caller — deploy scripts, the admin-token
    # refresh flow, monitoring, anyone's bookmark to 169.58.77.61 — keeps
    # working exactly as before. This block only ever sees the bare IP now:
    # the domain is claimed by the more specific server_name block below,
    # and nginx always prefers the more specific match regardless of order.
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME HTTP-01 challenge. Served from a plain file share,
        # not proxied — certbot writes here, nginx just needs to serve it back.
        # Must stay reachable over plain HTTP for certificate renewal.
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        include /etc/nginx/proxy-locations.conf;
    }

    # Plain HTTP to the real domain specifically — redirected to HTTPS.
    # Split out from the catch-all above so the IP keeps working unredirected.
    server {
        listen 80;
        server_name insan-eg.com www.insan-eg.com;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS for the real domain. Only insan-eg.com / www.insan-eg.com match
    # server_name here — a request for the bare IP over HTTPS won't match
    # this block (and has no certificate to match anyway), so it falls
    # through to whatever nginx's default handling is, not this domain's cert.
    server {
        listen 443 ssl;
        server_name insan-eg.com www.insan-eg.com;

        ssl_certificate     /etc/nginx/ssl/live/insan-eg.com/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/insan-eg.com/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        include /etc/nginx/proxy-locations.conf;
    }
}
