services:
  db:
    image: postgres:16-alpine
    container_name: insan-db
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insan"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      target: api-production
    container_name: insan-api
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/uploads
      - ../receptionist:/receptionist:ro
    depends_on:
      - db
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  web:
    build:
      context: .
      target: web-production
    container_name: insan-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      - PORT=5000
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  nginx:
    image: nginx:alpine
    container_name: insan-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/ssl:/etc/nginx/ssl:ro
      - ./infra/certbot-webroot:/var/www/certbot
      - uploads_data:/usr/share/nginx/html/uploads:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  uploads_data:
