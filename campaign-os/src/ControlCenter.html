            html += 'These follow the Hijri calendar and are confirmed by ' +
              'announcement, so the system will not estimate them. Add them to ' +
              'CONFIG.EVENTS_CALENDAR.MOVEABLE as YYYY-MM-DD.<br><br>' +
              'Ramadan needs the most notice: medication-timing content has to ' +
              'be written and clinically reviewed before the month starts.</div>';
          }

          showInfo('What Is Coming', html);
        })
        .withFailureHandler(function(err) {
          enableAll();
          showError('What Is Coming', err.message, 'Try again.');
        })
        .getUpcomingEvents(90);
    }

    // Not a row range: it moves everything that is ready and skips whatever is
    // already downstream, so running it twice is a no-op and there is nothing
    // to confirm.
    function doTransfer() {
      if (isRunning) return;
      disableAll();

      google.script.run
        .withSuccessHandler(function(result) {
          enableAll();
          loadDashboard(true);

          if (!result.success) {
            showError('Transfer Failed', result.error, 'Check the Execution Log for details.');
            return;
          }

          var html =
            '<div class="row"><span class="label">Calendar &#8594; Content Pipeline</span>' +
            '<span class="value">' + result.toPipeline.written + ' new' +
            (result.toPipeline.skipped ? ', ' + result.toPipeline.skipped + ' already there' : '') +
            '</span></div>' +
            '<div class="row"><span class="label">Content &#8594; Visual Pipeline</span>' +
            '<span class="value">' + result.toVisual.written + ' new' +
            (result.toVisual.skipped ? ', ' + result.toVisual.skipped + ' already there' : '') +
            (result.toVisual.notApproved ? ', ' + result.toVisual.notApproved +
              ' waiting on the Creative Director' : '') +
            '</span></div>';

          // Named, not counted. A row transferred with no strategy behind it
          // will be refused by every worker downstream, and the fix is to build
          // that campaign's card — which needs the campaign's name.
          var noCard = Object.keys(result.toPipeline.noCard || {});

          if (noCard.length) {
            html += '<div style="margin-top:10px;font-size:11px;color:var(--red)">' +
              '<strong>Transferred with no strategy</strong> — these campaigns ' +
              'have no card:<br>';
            for (var i = 0; i < noCard.length; i++) {
              html += '&nbsp;&nbsp;' + noCard[i] +
                ' (' + result.toPipeline.noCard[noCard[i]] + ' rows)<br>';
            }
            html += 'The workers will refuse these rows rather than invent a ' +
              'strategy. Build the cards and run this again — the rows already ' +
              'transferred are not duplicated.</div>';
          }

          if (result.unknownColumns && result.unknownColumns.length) {
            html += '<div style="margin-top:10px;font-size:11px;color:var(--red)">' +
              'No column exists for: ' + result.unknownColumns.join(', ') +
              '<br>Run Maintenance &#8594; Create Managed Columns.</div>';
          }

          showInfo('Transfer Rows Forward', html);
        })
        .withFailureHandler(function(err) {
          enableAll();
          showError('Transfer Error', err.message, 'Check the Apps Script log for details.');
        })
        .executeTransfer();
    }

    // Read once at open. The flag lives in CONFIG and only changes when someone
    // edits and re-pastes the file, so polling it would be a round trip per
    // interval for a value that cannot move while the panel is up.
    function loadPublishingMode() {
      google.script.run
        .withSuccessHandler(function(mode) {
          publishDryRun = mode && mode.unknown ? null : !!(mode && mode.dryRun);
          paintPublishButton();
        })
        .withFailureHandler(function() {
          publishDryRun = null;
          paintPublishButton();
        })
        .getPublishingMode();
    }

    // The state goes on the button, not only in the dialog after the click.
    // Publishing is the one action here that cannot be undone from the sheet,
    // and an operator who believes they are testing and is not is the failure
    // this label exists to prevent.
    function paintPublishButton() {
      var btn = document.getElementById('btn-publish');
      var label = document.getElementById('publish-label');
      var note = document.getElementById('publish-mode-note');
      if (!btn || !label || !note) return;

      if (publishDryRun === true) {
        label.textContent = 'Publish — DRY RUN';
        btn.className = 'btn btn-outline';
        note.innerHTML = 'Dry run: rows are resolved in full and nothing is posted.';
        return;
      }

      if (publishDryRun === false) {
        label.textContent = 'Publish — LIVE';
        btn.className = 'btn btn-stop';
        note.innerHTML = '<strong style="color:var(--red)">LIVE.</strong> ' +
          'Approved rows will be posted to real Facebook pages. This cannot be ' +
          'undone from the sheet.';
        return;
      }

      // Unknown is not the same as safe.
      label.textContent = 'Publish — mode unknown';
      btn.className = 'btn btn-stop';
      note.innerHTML = 'Could not read CONFIG.PUBLISHING.DRY_RUN. Treat this as ' +
        'live until you have checked it.';
    }

    // ==================== INIT ====================

    loadDashboard();
    loadPublishingMode();
    loadPlanningContext();
    startAutoRefresh();

    // The ceiling note tracks what is being typed. Bound here rather than with
    // inline onchange so the markup stays readable.
    document.getElementById('pl-per-day').addEventListener('input', paintCeilingNote);
    document.getElementById('pl-pages').addEventListener('change', paintCeilingNote);
  </script>

</body>
</html>
